services:
  postgres_geo:
    image: postgis/postgis:15-3.3
    container_name: puertaApuerta_db_local
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-puertaApuerta_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-puertaApuerta_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations/001_baseline.sql:/docker-entrypoint-initdb.d/001_baseline.sql:ro

  api:
    build: .
    container_name: puertaApuerta_api
    restart: always
    command: sh -c "npm run db:migrate && npm start"
    ports:
      - "4000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres_geo
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-puertaApuerta_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS es obligatorio}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
    depends_on:
      postgres_geo:
        condition: service_healthy

volumes:
  postgres_data:
